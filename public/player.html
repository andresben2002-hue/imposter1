<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Imposter Party · Player</title><link href="/style.css" rel="stylesheet"/></head><body><main class="phone"><div class="languagebar"><select aria-label="Language / Idioma" class="lang-picker"><option value="en">English</option><option value="es">Español</option></select></div><div class="eyebrow" data-i18n="PRIVATE PLAYER SCREEN">PRIVATE PLAYER SCREEN</div><div class="hero">IMPOSTER<span style="color:#a5b8ff">.</span></div><p class="subtitle" data-i18n="One word. One liar. Trust nobody.">One word. One liar. Trust nobody.</p>
<div class="card" id="join"><h2 data-i18n="Join a room">Join a room</h2><div class="field"><label data-i18n="6-digit room code" for="room">6-digit room code</label><input autocomplete="off" id="room" inputmode="numeric" maxlength="6" placeholder="123456"/></div><div class="field"><label data-i18n="Your name" for="name">Your name</label><input autocomplete="nickname" data-i18n-placeholder="Enter your name" id="name" maxlength="22" placeholder="Enter your name"/></div><button class="full" data-i18n="Join game" id="joinBtn">Join game</button><div class="notice" id="joinError"></div></div>
<div class="hidden stack" id="play"><div class="card"><div class="row between"><span class="pill" id="phase">LOBBY</span><span class="round" id="round">ROUND 0</span></div><h2 id="welcome" style="margin-top:20px"></h2><p class="muted" id="instructions"></p></div>
<div class="card secret hidden" id="secretCard"><div id="cover"><h2 data-i18n="Your secret is ready">Your secret is ready</h2><p class="muted" data-i18n="Make sure nobody is looking at your screen.">Make sure nobody is looking at your screen.</p><button data-i18n="Tap to reveal" id="reveal">Tap to reveal</button></div><div class="hidden" id="secret"><div class="eyebrow" id="roleLabel"></div><div class="word" id="word"></div><p class="muted" id="roleText"></p><button class="secondary full" data-i18n="Hide my role" id="hide">Hide my role</button></div></div>
<div class="card hidden" id="voteCard"><h2 data-i18n="Who is the Imposter?">Who is the Imposter?</h2><p class="muted" data-i18n="Tap one player to vote. Your choice is final.">Tap one player to vote. Your choice is final.</p><div id="voteOptions"></div><button class="full" data-i18n="Submit vote" disabled="" id="voteBtn">Submit vote</button><p class="notice" id="voteError"></p></div>
<div class="card center hidden" id="results"></div></div><p class="footer" data-i18n="Never show your private screen to another player.">Never show your private screen to another player.</p></main><div id="connection">Connecting...</div><script src="/i18n.js"></script><script src="/socket.io/socket.io.js"></script><script src="/player.js?v=2.5.0"></script></body></html>
